name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mud-tool:
    name: mud-tool (design half)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mud-tool/python-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . || true
      - name: Unit tests
        run: pytest -q -m "not live" || true

  launcher:
    name: launcher (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile launcher
        run: |
          python -m py_compile launcher/streamlit_app.py launcher/_common.py
      - name: Traceability extraction self-check
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from mudmut_core.trace import extract_requirements
          reqs = extract_requirements("/* Requirements: REQ_001, REQ_002 */")
          assert reqs == ["REQ_001", "REQ_002"], reqs
          print("ok", reqs)
          PY

  cpputest-rag:
    name: cpputest-rag (backend import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpputest-rag/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import app
        run: python -c "import app.main; print('cpputest-rag backend imports OK')"

  mudmut-core:
    name: mudmut_core (engine + exporter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "mud-tool/python-sidecar[dev]"
          pip install -r cpputest-rag/backend/requirements-native.txt
      - name: mudmut_core unit tests
        run: pytest mudmut_core/tests -q
      - name: C-skeleton exporter tests
        run: pytest mud-tool/python-sidecar/tests/unit/test_c_skeleton_exporter.py -q

  agentic:
    name: agentic spike (mudmut CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mudtool (for the CLI)
        run: |
          python -m pip install --upgrade pip
          pip install -e mud-tool/python-sidecar pytest
      - name: CLI unit tests
        run: pytest agentic/tests -q
